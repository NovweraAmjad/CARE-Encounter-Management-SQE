sonar.projectKey=care-encounter-management
sonar.projectName=CARE Encounter Management
sonar.sourceEncoding=UTF-8

# Scope = the system under test for the two encounter workflows (not all of CARE).
# care/ and care_fe/ are separate checkouts of the upstream baselines
# (backend ddfd840, frontend 5e02f9a + testing/accessibility/after/*.patch).
sonar.sources=\
  care/care/emr/api/viewsets/encounter.py,\
  care/care/emr/resources/encounter/spec.py,\
  care/care/emr/resources/encounter/constants.py,\
  care/care/security/authorization/encounter.py,\
  care_fe/src/components/Encounter/CreateEncounterForm.tsx,\
  care_fe/src/pages/Encounters/utils/useEncounterProgressController.ts,\
  care_fe/src/pages/Encounters/MarkEncounterAsCompletedDialog.tsx,\
  care_fe/src/pages/Encounters/tabs/overview/summary-panel-actions.tab.tsx,\
  care_fe/src/pages/Encounters/EncounterShow.tsx

# Our own test code is analysed as test code.
sonar.tests=testing
sonar.test.exclusions=**/node_modules/**,**/reports/**,**/test-results/**,**/evidence/**,testing/mutation/results/**,testing/accessibility/**,testing/security/zap/reports/**,testing/security/dependency-audit/**

# Backend line/branch coverage from coverage.py (paths rewritten from the
# container's /app to the checkout by testing/coverage/sonar_coverage_paths.py).
sonar.python.coverage.reportPaths=testing/coverage/coverage-sonar.xml
sonar.python.version=3.13

# The frontend modules are verified by Playwright browser tests, which produce
# no line-coverage report, so they are excluded from the coverage metric only
# (they are still analysed for bugs, smells, complexity and duplication).
sonar.coverage.exclusions=care_fe/**

sonar.scm.disabled=true
